[project]
name = "building-modeller"
version = "0.1.0"
description = "Local desktop tool to model 3D CityGML LOD2.2 buildings from BAG footprints and AHN6 LiDAR, with export to static CityGML."
requires-python = ">=3.9,<3.10"
readme = "README.md"
dependencies = [
    "PySide6>=6.5,<6.10",
    "pyqtgraph>=0.13,<0.15",
    "PyOpenGL>=3.1,<3.2",
    "numpy>=1.23,<2.0",
    "shapely>=2.0,<3.0",
    "geopandas>=0.13,<0.15",
    "pyogrio>=0.7,<0.9",
    "laspy[lazrs]>=2.4,<2.6",
    "lxml>=4.9,<6.0",
    "requests>=2.28,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
]

[project.scripts]
building-modeller = "building_modeller.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
